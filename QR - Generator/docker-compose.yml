version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: qr_db
    restart: always
    environment:
      POSTGRES_USER: qr_user
      POSTGRES_PASSWORD: qr_password
      POSTGRES_DB: qr_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: qr_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: qr_minio
    restart: always
    environment:
      MINIO_ROOT_USER: qr_minio_user
      MINIO_ROOT_PASSWORD: qr_minio_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:

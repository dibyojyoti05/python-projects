version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: networkpulse-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-networkpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-networkpulse123}
      POSTGRES_DB: ${POSTGRES_DB:-networkpulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: networkpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
